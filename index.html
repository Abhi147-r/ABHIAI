      --display:"Bricolage Grotesque","Hind",system-ui,sans-serif; --body:"Hind",system-ui,-apple-system,"Segoe UI",sans-serif;
      color-scheme:dark;
    }
    *{box-sizing:border-box}
    html{height:100%}
    body{margin:0;min-height:100%;font-family:var(--body);color:var(--sand);background:
      radial-gradient(60% 38% at 50% 14%,rgba(243,181,98,.16),transparent 70%),
      radial-gradient(50% 40% at 100% 0%,rgba(224,86,111,.10),transparent 70%),
      var(--ink);
      padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
    button{font:inherit;color:inherit}
    svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
    :focus-visible{outline:2px solid var(--amber);outline-offset:3px}

    .page{max-width:920px;margin:0 auto;padding:18px 18px 28px}
    .topbar{display:flex;align-items:center;justify-content:space-between}
    .wordmark{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.2px}
    .status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
    .status i{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px rgba(243,181,98,.15)}

    /* Hero: portrait on top */
    .hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 0 26px}
    .stage{position:relative;width:min(48vw,198px);aspect-ratio:4/5;perspective:900px;margin-bottom:22px}
    .ring{position:absolute;inset:-14% -22%;border-radius:50%;border:1px solid rgba(243,181,98,.45);transform:rotateX(72deg) rotateZ(0);animation:orbit 14s linear infinite}
    .ring.two{inset:-8% -34%;border-color:rgba(239,228,210,.18);transform:rotateX(72deg) rotateY(18deg) rotateZ(0);animation-duration:22s;animation-direction:reverse}
    .portrait{position:absolute;inset:0;border-radius:999px 999px 30px 30px;overflow:hidden;border:1px solid rgba(243,181,98,.5);box-shadow:0 26px 60px -18px rgba(0,0,0,.8),0 0 0 8px rgba(243,181,98,.06);background:var(--panel)}
    .portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
    .portrait:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(5,5,5,.55),transparent 40%)}
    .call-live .ring{animation-duration:4s}
    .call-live .ring.two{animation-duration:7s}
    .call-live .portrait{animation:pulse 1.8s ease-in-out infinite}
    @keyframes orbit{to{transform:rotateX(72deg) rotateZ(360deg)}}
    @keyframes pulse{50%{box-shadow:0 26px 60px -18px rgba(0,0,0,.8),0 0 0 14px rgba(224,86,111,.14)}}

    .hero h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,8vw,48px);line-height:1.05;letter-spacing:-.8px;margin:0 0 10px}
    .hero p{margin:0 0 22px;color:var(--dim);font-size:16px;line-height:1.55;max-width:34ch}
    .call-btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:14px 26px;font-weight:600;font-size:16px;cursor:pointer;color:#1a1204;background:linear-gradient(180deg,#F8C57E,var(--amber-d));box-shadow:0 10px 28px -10px rgba(243,181,98,.7);transition:transform .15s,box-shadow .15s}
    .call-btn:hover{transform:translateY(-1px);box-shadow:0 14px 32px -10px rgba(243,181,98,.85)}
    .call-btn.active{color:#fff;background:linear-gradient(180deg,#EC6C84,#C03F58);box-shadow:0 10px 28px -10px rgba(224,86,111,.8)}

    /* Chat */
    .chat{background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
    .chat-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-size:14px;color:var(--dim)}
    .new-btn{border:1px solid var(--line);background:transparent;color:var(--sand);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer}
    .new-btn:hover{border-color:var(--amber);color:var(--amber)}
    .messages{height:min(760px,72vh);overflow:auto;padding:18px;scroll-behavior:smooth}
    .message{display:flex;gap:10px;margin-bottom:14px;align-items:flex-end}
    .message.user{justify-content:flex-end}
    .avatar{width:30px;height:30px;border-radius:50%;flex:none;background:var(--photo) 50% 18%/cover;border:1px solid rgba(243,181,98,.5)}
    .bubble{max-width:78%;padding:11px 15px;border-radius:18px 18px 18px 6px;background:var(--panel2);font-size:15.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
    .user .bubble{background:var(--amber);color:#1a1204;border-radius:18px 18px 6px 18px;font-weight:500}
    .table-wrap{max-width:100%;overflow-x:auto;margin:8px 0;border:1px solid var(--line);border-radius:10px}
    .assistant-table{width:100%;border-collapse:collapse;font-size:14px;white-space:normal}
    .assistant-table th,.assistant-table td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
    .assistant-table th{color:var(--amber);background:rgba(243,181,98,.08);font-weight:600}
    .assistant-table tr:last-child td{border-bottom:0}

    .composer{display:flex;gap:8px;align-items:center;padding:12px;border-top:1px solid var(--line);background:rgba(5,5,5,.35)}
    .composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--ink);color:var(--sand);border-radius:999px;padding:13px 18px;font:inherit;font-size:15.5px;outline:none}
    .composer input::placeholder{color:#77736C}
    .composer input:focus{border-color:var(--amber)}
    .tool,.mic,.send-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;border:1px solid var(--line);background:var(--panel2);color:var(--sand);transition:border-color .15s,background .15s}
    .tool:hover,.mic:hover{border-color:var(--amber)}
    .mic .stop{display:none}
    .mic.on{background:rgba(224,86,111,.18);border-color:var(--rose);color:#ff9bac}
    .mic.on .stop{display:block}.mic.on .micon{display:none}
    .send-btn{border:0;background:var(--amber);color:#1a1204}
    .send-btn:disabled{opacity:.5;cursor:default}

    .hint{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:2px 16px 14px;color:var(--dim);font-size:13px}
    .voice{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--sand);cursor:pointer;font-size:13px;white-space:nowrap}
    .voice svg{width:17px;height:17px}
    .voice.off{color:var(--dim)}.voice.off .wave{display:none}

    .hint-tools{display:flex;align-items:center;gap:12px}
    .image-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(243,181,98,.42);border-radius:999px;padding:7px 12px;background:rgba(243,181,98,.08);color:var(--amber);cursor:pointer;font-size:13px;white-space:nowrap;transition:background .2s,transform .2s}
    .image-btn:hover{background:rgba(243,181,98,.16);transform:translateY(-1px)}
    .image-btn:disabled{opacity:.5;cursor:wait;transform:none}
    .image-btn svg{width:16px;height:16px}
    .image-loading-card{width:min(100%,360px);overflow:hidden;border:1px solid rgba(243,181,98,.3);border-radius:18px;background:radial-gradient(ellipse at 50% 35%,rgba(243,181,98,.16),transparent 56%),linear-gradient(145deg,#171719,#09090a);box-shadow:inset 0 0 36px rgba(243,181,98,.06)}
    .image-visual{height:230px;position:relative;display:grid;place-items:center;perspective:800px;overflow:hidden;background-image:linear-gradient(rgba(243,181,98,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(243,181,98,.045) 1px,transparent 1px);background-size:24px 24px;mask-image:linear-gradient(to bottom,#000 60%,transparent)}
    .image-orbit{position:absolute;width:155px;height:72px;border:1px solid rgba(243,181,98,.48);border-radius:50%;transform-style:preserve-3d;box-shadow:0 0 18px rgba(243,181,98,.12);animation:image-orbit 4s linear infinite}
    .image-orbit.orbit-two{width:112px;height:176px;border-color:rgba(224,86,111,.42);animation-duration:5.5s;animation-direction:reverse}
    .image-cube{position:relative;width:74px;height:74px;transform-style:preserve-3d;animation:image-cube-spin 7s linear infinite}
    .image-cube i{position:absolute;inset:0;border:1px solid rgba(255,223,172,.9);background:linear-gradient(145deg,rgba(243,181,98,.28),rgba(224,86,111,.11));box-shadow:inset 0 0 20px rgba(243,181,98,.18),0 0 16px rgba(243,181,98,.12);backface-visibility:visible}
    .image-cube .front{transform:translateZ(37px)}.image-cube .back{transform:rotateY(180deg) translateZ(37px)}
    .image-cube .right{transform:rotateY(90deg) translateZ(37px)}.image-cube .left{transform:rotateY(-90deg) translateZ(37px)}
    .image-cube .top{transform:rotateX(90deg) translateZ(37px)}.image-cube .bottom{transform:rotateX(-90deg) translateZ(37px)}
    .image-scan{position:absolute;left:8%;right:8%;height:1px;background:linear-gradient(90deg,transparent,var(--amber),transparent);box-shadow:0 0 14px var(--amber);animation:image-scan 2.6s ease-in-out infinite}
    .image-loading-copy{position:relative;margin:-34px 16px 16px;text-align:center;display:grid;gap:5px}
    .image-loading-copy strong{font-family:var(--display);font-size:15px;color:var(--sand)}
    .image-loading-copy span{font-size:12px;color:var(--dim)}
    .image-output{display:block;width:min(100%,520px);height:auto;border-radius:14px;border:1px solid rgba(243,181,98,.28)}
    .image-prompt-overlay{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.76);backdrop-filter:blur(8px)}
    .image-prompt-dialog{width:min(100%,460px);padding:22px;border:1px solid rgba(243,181,98,.38);border-radius:18px;background:linear-gradient(145deg,#1a1918,#0c0c0d);box-shadow:0 24px 90px #000b}
    .image-prompt-dialog h2{margin:0 0 8px;color:var(--sand);font:600 20px Georgia,serif}
    .image-prompt-dialog p{margin:0 0 16px;color:var(--dim);font-size:13px;line-height:1.5}
    .image-prompt-dialog input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:#09090a;color:var(--sand);font:inherit;outline:none}
    .image-prompt-dialog input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(243,181,98,.12)}
    .image-prompt-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
    .image-prompt-actions button{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#171719;color:var(--sand);cursor:pointer}
    .image-prompt-actions .primary{border-color:var(--amber);background:var(--amber);color:#17120a;font-weight:600}
    .image-prompt-error{min-height:18px;margin-top:7px;color:var(--rose);font-size:12px}
    .chart-card{width:min(100%,640px);padding:16px;border:1px solid rgba(243,181,98,.28);border-radius:18px;background:linear-gradient(145deg,#171719,#09090a);overflow:hidden}
    .chart-card h3{margin:0 0 10px;font:600 16px var(--display);color:var(--sand)}
    .chart-svg{display:block;width:100%;height:auto;overflow:visible}
    .chart-svg text{font-family:var(--body);fill:var(--dim);font-size:12px}
    .chart-svg .chart-title{fill:var(--sand);font:600 15px var(--display)}
    .chart-note{margin:8px 0 0;color:var(--dim);font-size:12px;line-height:1.45}
    .chart-loading{height:180px;display:grid;place-items:center;color:var(--dim);font-size:13px}
    .chart-bars{display:flex;align-items:end;gap:7px;height:54px;perspective:300px}
    .chart-bars i{display:block;width:12px;height:25%;border-radius:4px 4px 1px 1px;background:linear-gradient(180deg,var(--amber),var(--rose));transform:rotateY(-14deg);transform-origin:bottom;animation:chart-build 1s ease-in-out infinite alternate}
    .chart-bars i:nth-child(2){animation-delay:.15s}.chart-bars i:nth-child(3){animation-delay:.3s}.chart-bars i:nth-child(4){animation-delay:.45s}.chart-bars i:nth-child(5){animation-delay:.6s}
    @keyframes chart-build{to{height:100%;filter:brightness(1.3)}}
    @keyframes image-cube-spin{to{transform:rotateX(360deg) rotateY(720deg) rotateZ(180deg)}}
    @keyframes image-orbit{to{transform:rotateX(68deg) rotateZ(360deg)}}
    @keyframes image-scan{0%,100%{top:22%;opacity:.25}50%{top:78%;opacity:1}}

    @media(max-width:520px){.page{padding:14px 14px 24px}.stage{width:min(42vw,170px);margin-bottom:22px}.bubble{max-width:86%}.status span{display:none}.hint{gap:6px;font-size:12px}.hint-tools{gap:7px}.image-btn{padding:7px 9px;font-size:12px}}
    @media(prefers-reduced-motion:reduce){.ring,.call-live .ring,.call-live .portrait,.image-cube,.image-orbit,.image-scan,.chart-bars i{animation:none}.messages{scroll-behavior:auto}}
  </style>
</head>

  <script>
    const $=s=>document.querySelector(s);const messages=$('#messages'),prompt=$('#prompt'),sendBtn=$('#sendBtn'),micBtn=$('#micBtn'),status=$('#status'),hint=$('#hintText'),voiceToggle=$('#voiceToggle'),voiceLbl=$('#voiceLbl'),imageBtn=$('#imageBtn'),callBtn=$('#callBtn'),callLbl=$('#callLbl');let voiceOn=true,callMode=false,recording=false,recorder,chunks=[],liveRecognition,history=[];
    function addMessage(role,text){const row=document.createElement('div');row.className='message '+role;row.innerHTML=(role==='assistant'?'<div class="avatar"></div>':'')+'<div class="bubble"></div>';row.querySelector('.bubble').textContent=text;messages.appendChild(row);messages.scrollTop=messages.scrollHeight;history.push({role:role==='assistant'?'assistant':'user',content:text})}
    function renderRichText(bubble,text){
      const lines=text.split(/\r?\n/),frag=document.createDocumentFragment();let plain=[];
      const cells=line=>{const t=line.trim();if(t.includes('|'))return t.replace(/^\|+|\|+$/g,'').split('|').map(x=>x.trim());if(t.includes('\t'))return t.split('\t').map(x=>x.trim());return null};
      const tableLine=line=>{const c=cells(line);return c&&c.length>1};
      const flush=()=>{if(plain.length){const p=document.createElement('p');p.style.margin='0 0 8px';p.textContent=plain.join('\n');frag.appendChild(p);plain=[]}};
      for(let i=0;i<lines.length;){if(!tableLine(lines[i])){plain.push(lines[i]);i++;continue}let block=[];while(i<lines.length&&tableLine(lines[i])){const raw=lines[i].trim();if(!/^\|?\s*:?-{3,}/.test(raw))block.push(cells(lines[i]));i++}if(block.length<2){plain.push(...block.flat());continue}flush();const wrap=document.createElement('div');wrap.className='table-wrap';const table=document.createElement('table');table.className='assistant-table';const thead=document.createElement('thead'),trh=document.createElement('tr');block[0].forEach(v=>{const th=document.createElement('th');th.textContent=v;trh.appendChild(th)});thead.appendChild(trh);table.appendChild(thead);const tbody=document.createElement('tbody');block.slice(1).forEach(row=>{const tr=document.createElement('tr');row.forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});tbody.appendChild(tr)});table.appendChild(tbody);wrap.appendChild(table);frag.appendChild(wrap)}flush();bubble.replaceChildren(frag)
    }
    function setBusy(b){sendBtn.disabled=b;status.innerHTML='<i></i><span>'+(b?'Thinking…':callMode?'Call live':'Ready')+'</span>'}
    function speak(text){if(!voiceOn)return;if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='hi-IN';u.rate=1.03;speechSynthesis.speak(u)}}
    function playBase64(b64){if(!voiceOn||!b64)return;const audio=new Audio('data:audio/wav;base64,'+b64);audio.volume=1;audio.play().catch(()=>speak('Please tap the page once to enable audio.'))}
    let ttsGen=0,curAud=null;
    function playClip(src){return new Promise(res=>{const a=new Audio(src);curAud=a;a.onended=a.onerror=()=>res(true);a.play().catch(()=>res(false))})}
    function speakP(t){return new Promise(res=>{if(!('speechSynthesis'in window)){res();return}const u=new SpeechSynthesisUtterance(t);u.lang='hi-IN';u.rate=1.03;u.onend=u.onerror=()=>res();speechSynthesis.speak(u)})}
    async function fetchTts(t){try{const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});const d=await r.json();return d.audio_b64||null}catch(e){return null}}
    /* Chat ab STREAM hota hai: jawab ke shabd aate hi screen par dikhte hain aur pehla vakya turant bolna shuru hota hai */
    function isImageRequest(text){
      const s=text.trim().toLowerCase();
      const explicit=/(?:\b(?:image|iage|imag|imge|iamge|img|picture|photo|pic|photograph|artwork|illustration|poster|wallpaper|logo|diagram)\b.*\b(?:make|create|generate|draw|paint|banao|bana|bnao|banado)\b)|\b(?:make|create|generate|draw|paint)\b.*\b(?:image|iage|imag|imge|iamge|img|picture|photo|pic|photograph|artwork|illustration|poster|wallpaper|logo|diagram)\b|(?:इमेज|तस्वीर|फोटो|चित्र).*(?:बनाओ|बना|बना दो|बना दे|बनादो)|(?:बनाओ|बना दो|बना दे|बनादो).*(?:इमेज|तस्वीर|फोटो|चित्र)/i.test(s);
      const direct=/^(?:please\s+)?(?:create|generate|draw|paint)\s+(?:(?:me|a|an|the)\s+)?(?!table\b|spreadsheet\b|report\b|document\b|list\b|plan\b|code\b|story\b)[a-z][a-z -]{1,100}$/i.test(s);
      const imageMention=/\b(?:image|iage|imag|imge|iamge|img|picture|photo|pic|photograph|artwork|illustration|diagram)\b/i.test(s)&&!/(?:\bwhat\s+is\b|\bmeaning\b|\bexplain\b|\bdescribe\b|क्या है|मतलब|समझाओ|बताओ)/i.test(s);
      return explicit||direct||imageMention;
    }
    function isChartRequest(text){
      const s=text.trim().toLowerCase();
      const asks=/\b(?:bar\s*graph|bar\s*chart|graph|chart|plot)\b.*\b(?:make|create|draw|generate|show|bana|banao|banado)\b|\b(?:make|create|draw|generate|show|bana|banao|banado)\b.*\b(?:bar\s*graph|bar\s*chart|graph|chart|plot)\b|(?:ग्राफ|चार्ट).*(?:बनाओ|बना|बना दो|बना दे)|(?:बनाओ|बना दो|बना दे).*(?:ग्राफ|चार्ट)/i.test(s);
      return asks;
    }
    async function send(){
      const text=prompt.value.trim();if(!text)return;
      if(isChartRequest(text)){generateChart(text);return}
      if(isImageRequest(text)){generateImage(text);return}
      prompt.value='';
      addMessage('user',text);setBusy(true);
      const gen=++ttsGen;if(curAud){try{curAud.pause()}catch(e){}}if('speechSynthesis'in window)speechSynthesis.cancel();
      const row=document.createElement('div');row.className='message assistant';row.innerHTML='<div class="avatar"></div><div class="bubble"></div>';
      const bubble=row.querySelector('.bubble');let shown=false,full='',chain=Promise.resolve();
      const show=()=>{if(!shown){messages.appendChild(row);shown=true}bubble.textContent=full;messages.scrollTop=messages.scrollHeight};
      const queue=(sentence,url)=>{const p=(!url&&voiceOn)?fetchTts(sentence):null;chain=chain.then(async()=>{if(gen!==ttsGen||!voiceOn)return;if(url){await playClip(url);return}const b=await p;if(gen!==ttsGen||!voiceOn)return;if(b)await playClip('data:audio/wav;base64,'+b);else await speakP(sentence)})};
      try{
        const r=await fetch('/api/chat_stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:history.slice(0,-1).slice(-12),document:attached})});
        if(!r.ok){let m='Something went wrong.';try{const d=await r.json();m=d.error||m}catch(e){}full=m;show();return}
        const reader=r.body.getReader(),dec=new TextDecoder();let sb='';
        while(true){
          const {value,done}=await reader.read();if(done)break;
          sb+=dec.decode(value,{stream:true});let idx;
          while((idx=sb.indexOf('\n\n'))>=0){
            const raw=sb.slice(0,idx);sb=sb.slice(idx+2);
            if(!raw.startsWith('data: '))continue;
            let ev;try{ev=JSON.parse(raw.slice(6))}catch(e){continue}
            if(ev.type==='sentence'){full+=(full?' ':'')+ev.text;show();queue(ev.text,null)}
            else if(ev.type==='abuse'){full=ev.answer;show();queue('',ev.audio_url)}
            else if(ev.type==='error_detail'){hint.textContent='Error: '+ev.text}
            else if(ev.type==='done'&&ev.answer&&!full){full=ev.answer;show()}
          }
        }
        if(!shown){full=full||'Something went wrong.';show()}
        if(shown)renderRichText(bubble,full);
        history.push({role:'assistant',content:full});
      }catch(e){if(!shown){full='Connection problem. Check whether the server is running.';show()}}
      finally{setBusy(false)}
    }
    async function generateImage(promptText=''){
      const text=String(promptText||prompt.value).trim();if(!text){hint.textContent='What image would you like to create? Type your description above.';prompt.placeholder='What image would you like to create?';prompt.focus();return}
      prompt.value='';addMessage('user',text);setBusy(true);imageBtn.disabled=true;status.innerHTML='<i></i><span>Creating image…</span>';hint.textContent='Image tayyar ho rahi hai…';
      const row=document.createElement('div');row.className='message assistant';row.innerHTML='<div class="avatar"></div><div class="bubble"><div class="image-loading-card" role="status" aria-live="polite"><div class="image-visual" aria-hidden="true"><div class="image-orbit"></div><div class="image-orbit orbit-two"></div><div class="image-cube"><i class="front"></i><i class="back"></i><i class="right"></i><i class="left"></i><i class="top"></i><i class="bottom"></i></div><div class="image-scan"></div></div><div class="image-loading-copy"><strong>Image ban rahi hai</strong><span>Thoda intezaar karein…</span></div></div></div>';
      messages.appendChild(row);messages.scrollTop=messages.scrollHeight;const bubble=row.querySelector('.bubble');
      try{const r=await fetch('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:text})});const d=await r.json();if(!r.ok||!d.image_b64)throw new Error(d.error||'Image nahi ban payi. Dobara try karein.');const img=document.createElement('img');img.className='image-output';img.alt='Generated image';img.src=`data:${d.mime||'image/jpeg'};base64,${d.image_b64}`;bubble.replaceChildren(img);messages.scrollTop=messages.scrollHeight;hint.textContent='Image ready.';history.push({role:'assistant',content:'[Image generated]'})}
      catch(e){bubble.textContent=e.message||'Image nahi ban payi. Dobara try karein.';hint.textContent='Image generation mein dikkat aayi.'}
      finally{setBusy(false);imageBtn.disabled=false}
    }
    function svgNode(tag,attrs={},text=''){const el=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,String(v));if(text)el.textContent=text;return el}
    function renderChart(data){
      const card=document.createElement('div');card.className='chart-card';const heading=document.createElement('h3');heading.textContent=data.title||'Chart';card.appendChild(heading);
      const svg=svgNode('svg',{viewBox:'0 0 640 360',class:'chart-svg',role:'img','aria-label':data.title||'Generated chart'});const categories=data.categories||[],series=data.series||[],all=(series.flatMap(x=>x.values||[])).map(Number);const max=Math.max(1,...all);const top=Math.ceil(max/5)*5;const left=48,right=14,topY=38,bottom=282,plotH=bottom-topY,plotW=640-left-right;
      for(let t=0;t<=5;t++){const y=bottom-plotH*t/5;svg.appendChild(svgNode('line',{x1:left,y1:y,x2:640-right,y2:y,stroke:'rgba(239,228,210,.14)','stroke-width':1}));svg.appendChild(svgNode('text',{x:left-8,y:y+4,'text-anchor':'end'},String(Math.round(top*t/5))))}
      const colors=['#F3B562','#E0566F','#86C8FF','#A7D88A'];const slot=plotW/Math.max(1,categories.length),groupW=slot*.68,barW=Math.max(8,groupW/Math.max(1,series.length)-5);
      categories.forEach((label,i)=>{const groupX=left+i*slot+(slot-groupW)/2;series.forEach((ser,j)=>{const val=Number(ser.values[i])||0,h=Math.max(2,plotH*Math.max(0,val)/top),x=groupX+j*(barW+5);svg.appendChild(svgNode('rect',{x,y:bottom-h,width:barW,height:h,rx:4,fill:colors[j%colors.length]}))});svg.appendChild(svgNode('text',{x:left+i*slot+slot/2,y:bottom+20,'text-anchor':'middle'},String(label).slice(0,16)))});
      series.forEach((ser,i)=>{const x=left+i*145;svg.appendChild(svgNode('rect',{x,y:326,width:10,height:10,rx:2,fill:colors[i%colors.length]}));svg.appendChild(svgNode('text',{x:x+15,y:335},String(ser.name).slice(0,24)))});
      card.appendChild(svg);if(data.note){const note=document.createElement('p');note.className='chart-note';note.textContent=data.note;card.appendChild(note)}return card;
    }
    async function generateChart(question){
      const prior=history.slice(-12);prompt.value='';addMessage('user',question);setBusy(true);status.innerHTML='<i></i><span>Preparing graph…</span>';hint.textContent='Graph tayyar ho raha hai…';
      const row=document.createElement('div');row.className='message assistant';row.innerHTML='<div class="avatar"></div><div class="bubble"><div class="chart-loading" role="status"><div style="display:grid;justify-items:center;gap:10px"><div class="chart-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><span>Graph ban raha hai…</span></div></div></div>';messages.appendChild(row);messages.scrollTop=messages.scrollHeight;const bubble=row.querySelector('.bubble');
      try{const r=await fetch('/api/chart',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,history:prior})});const d=await r.json();if(!r.ok||!Array.isArray(d.categories)||!Array.isArray(d.series))throw new Error(d.error||'Graph nahi ban paya. Dobara try karein.');bubble.replaceChildren(renderChart(d));messages.scrollTop=messages.scrollHeight;hint.textContent='Graph ready.';history.push({role:'assistant',content:`[Chart generated: ${d.title||'chart'}]`})}
      catch(e){bubble.textContent=e.message||'Graph nahi ban paya. Dobara try karein.';hint.textContent='Graph banane mein dikkat aayi.'}
      finally{setBusy(false)}
    }
    function askImagePrompt(){
      const overlay=document.createElement('div');overlay.className='image-prompt-overlay';
      const form=document.createElement('form');form.className='image-prompt-dialog';form.setAttribute('role','dialog');form.setAttribute('aria-modal','true');form.setAttribute('aria-labelledby','imagePromptTitle');
      const title=document.createElement('h2');title.id='imagePromptTitle';title.textContent='Create an image';
      const label=document.createElement('p');label.textContent='Whose image would you like me to create? You can also describe an animal, object, or scene.';
      const input=document.createElement('input');input.type='text';input.maxLength=600;input.placeholder='Describe the image…';input.setAttribute('aria-label','Image description');
      const error=document.createElement('div');error.className='image-prompt-error';error.setAttribute('aria-live','polite');
      const actions=document.createElement('div');actions.className='image-prompt-actions';
      const cancel=document.createElement('button');cancel.type='button';cancel.textContent='Cancel';
      const submit=document.createElement('button');submit.type='submit';submit.className='primary';submit.textContent='Generate';
      actions.append(cancel,submit);form.append(title,label,input,error,actions);overlay.appendChild(form);document.body.appendChild(overlay);
      const close=()=>overlay.remove();cancel.onclick=close;overlay.onclick=e=>{if(e.target===overlay)close()};input.onkeydown=e=>{if(e.key==='Escape')close()};
      form.onsubmit=e=>{e.preventDefault();const description=input.value.trim();if(!description){error.textContent='Please describe the image first.';input.focus();return}close();prompt.value=description;generateImage(description)};
      input.focus();
    }
    imageBtn.onclick=askImagePrompt;sendBtn.onclick=send;prompt.onkeydown=e=>{if(e.key==='Enter')send()};voiceToggle.onclick=()=>{voiceOn=!voiceOn;voiceLbl.textContent=voiceOn?'Voice on':'Voice off';voiceToggle.classList.toggle('off',!voiceOn);if(!voiceOn&&'speechSynthesis'in window)speechSynthesis.cancel()};$('#clearBtn').onclick=()=>{messages.innerHTML='<div class="message assistant"><div class="avatar"></div><div class="bubble">Let us start a new chat. How can I help you today?</div></div>';history=[]};let attached=null;const fileInput=document.createElement('input');fileInput.type='file';fileInput.accept='image/*,.pdf,.txt,.md,.csv,.json';fileInput.style.display='none';document.body.appendChild(fileInput);
    $('#plusBtn').onclick=()=>fileInput.click();
    fileInput.onchange=async()=>{const f=fileInput.files[0];fileInput.value='';if(!f)return;hint.textContent=f.type.startsWith('image/')?'Looking at image and reading visible text…':'Reading '+f.name+'…';setBusy(true);
      try{const fd=new FormData();fd.append('file',f);const r=await fetch('/api/upload',{method:'POST',body:fd});const d=await r.json();
        if(!r.ok||!d.text){const m=d.error||'File padh nahi payi.';hint.textContent=m;addMessage('assistant',m);setBusy(false);return}
        attached={name:d.name,text:d.text,kind:d.kind};hint.textContent='📎 '+d.name+' attached — ab iske baare me kuch bhi poochho (New chat se hat jayegi)';
        setBusy(false);prompt.value='फ़ाइल "'+d.name+'" में क्या है? आसान भाषा में समझाओ।';send()
      }catch(e){hint.textContent='Upload me dikkat. Server chal raha hai?';setBusy(false)}};
    const _clr=$('#clearBtn').onclick;$('#clearBtn').onclick=()=>{_clr();attached=null;fetch('/api/history',{method:'DELETE'}).catch(()=>{})};
    fetch('/api/history').then(r=>r.ok?r.json():[]).then(saved=>{if(Array.isArray(saved)&&saved.length){messages.innerHTML='';history=[];saved.forEach(m=>{if(m&&['user','assistant'].includes(m.role)&&typeof m.content==='string')addMessage(m.role,m.content)})}}).catch(()=>{});
    function startLive(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){startRecording();return}liveRecognition=new R();liveRecognition.lang='hi-IN';liveRecognition.continuous=true;liveRecognition.interimResults=true;liveRecognition.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)t+=e.results[i][0].transcript;if(t.trim()){prompt.value=t.trim();send()}};liveRecognition.onerror=()=>hint.textContent='I could not hear that clearly. Please speak again';liveRecognition.onend=()=>{if(callMode)try{liveRecognition.start()}catch(e){}};liveRecognition.start();recording=true;micBtn.classList.add('on');hint.textContent='Call live. Speak naturally and Abhi will answer each turn'}
    function stopLive(){if(liveRecognition){liveRecognition.onend=null;try{liveRecognition.stop()}catch(e){}liveRecognition=null}}
    async function startRecording(){if(!navigator.mediaDevices?.getUserMedia){hint.textContent='Live microphone is not available in this browser';return}const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}});recorder=new MediaRecorder(stream);chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const fd=new FormData();fd.append('audio',new Blob(chunks,{type:'audio/webm'}),'voice.webm');hint.textContent='Understanding your voice…';try{const r=await fetch('/api/transcribe',{method:'POST',body:fd}),d=await r.json();if(d.text){prompt.value=d.text;send()}else hint.textContent=d.error||'I could not understand the audio'}catch(e){hint.textContent='Speech-to-text connection problem'}};recorder.start();recording=true;micBtn.classList.add('on');hint.textContent='Listening. Press the mic again to stop'}
    micBtn.onclick=()=>{if(callMode)return;if(recording){recorder.stop();recording=false;micBtn.classList.remove('on')}else startRecording().catch(()=>hint.textContent='Allow microphone permission and try again')};callBtn.onclick=()=>{window.location.href='/call'};
  </script>
